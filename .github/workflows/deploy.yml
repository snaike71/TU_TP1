name: Deploy Zero Touch

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker daemon for insecure registry
        run: |
          echo '{"insecure-registries": ["${{ secrets.REGISTRY_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Login to AWS Registry
        run: |
          docker login ${{ secrets.REGISTRY_HOST }} \
            -u ${{ secrets.REGISTRY_USER }} \
            -p ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push API
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/api:latest server/
          docker push ${{ secrets.REGISTRY_HOST }}/api:latest

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/frontend:latest -f frontend.Dockerfile .
          docker push ${{ secrets.REGISTRY_HOST }}/frontend:latest

      - name: Build & Push MySQL
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/mysql:latest mysql/
          docker push ${{ secrets.REGISTRY_HOST }}/mysql:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        working-directory: infra/prod
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Bridge — extraire IP et clé SSH
        working-directory: infra/prod
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          SERVER_IP=$(terraform output -raw public_ip)
          echo "SERVER_IP=$SERVER_IP" >> $GITHUB_ENV
          terraform output -raw private_key_pem > key.pem
          chmod 600 key.pem
          echo "[web]" > inventory.ini
          echo "$SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=$(pwd)/key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'" >> inventory.ini

      - name: Attendre que l'EC2 soit prête
        run: sleep 40

      - name: Installer Ansible et les collections
        run: |
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lancer le playbook Ansible
        run: |
          ansible-playbook -i infra/prod/inventory.ini ansible/playbook.yml \
            --extra-vars "registry_host=${{ secrets.REGISTRY_HOST }} \
                         registry_user=${{ secrets.REGISTRY_USER }} \
                         registry_password=${{ secrets.REGISTRY_PASSWORD }} \
                         server_ip=${{ env.SERVER_IP }} \
                         mysql_root_password=${{ secrets.MYSQL_ROOT_PASSWORD }} \
                         mysql_db=${{ secrets.MYSQL_DB }} \
                         mysql_user=${{ secrets.MYSQL_USER }} \
                         mysql_password=${{ secrets.MYSQL_PASSWORD }}"

      - name: Attendre MySQL puis redémarrer l'API
        run: |
          ssh -i infra/prod/key.pem -o StrictHostKeyChecking=no ubuntu@${{ env.SERVER_IP }} \
            "echo 'Attente MySQL (connexion app user)...' && \
             for i in \$(seq 1 40); do \
               docker exec app-mysql-1 sh -c 'mysql -h 127.0.0.1 -u \$MYSQL_USER -p\$MYSQL_PASSWORD \$MYSQL_DATABASE -e \"SELECT 1\" 2>/dev/null' && echo 'MySQL prêt' && break; \
               echo \"Tentative \$i/40...\"; sleep 5; \
             done && \
             echo 'Redémarrage API...' && docker restart app-api-1 && sleep 10 && \
             echo '---LOGS API---' && docker logs app-api-1 2>&1 | tail -10 && \
             echo 'OK'"

      - name: Validation post-déploiement
        run: |
          echo "Attente du démarrage des conteneurs..."
          sleep 90
          echo "Test Frontend (port 80)..."
          curl -f --retry 10 --retry-delay 15 --retry-connrefused http://${{ env.SERVER_IP }} || exit 1
          echo "Test API (port 8000)..."
          curl -f --retry 10 --retry-delay 15 --retry-connrefused http://${{ env.SERVER_IP }}:8000/users || exit 1
          echo ""
          echo "Déploiement réussi !"
          echo "Frontend : http://${{ env.SERVER_IP }}"
          echo "API      : http://${{ env.SERVER_IP }}:8000"
          echo "Registry : https://${{ secrets.REGISTRY_HOST }}"
