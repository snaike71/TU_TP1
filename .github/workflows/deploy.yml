name: Deploy Zero Touch

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker daemon
        run: |
          echo '{"insecure-registries": ["${{ secrets.REGISTRY_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Login to Registry
        run: |
          docker login ${{ secrets.REGISTRY_HOST }} \
            -u ${{ secrets.REGISTRY_USER }} \
            -p ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push API
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/api:latest server/
          docker push ${{ secrets.REGISTRY_HOST }}/api:latest

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/frontend:latest -f frontend.Dockerfile .
          docker push ${{ secrets.REGISTRY_HOST }}/frontend:latest

      - name: Build & Push MySQL
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/mysql:latest mysql/
          docker push ${{ secrets.REGISTRY_HOST }}/mysql:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        working-directory: infra/prod
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Bridge — récupérer IP et clé SSH
        working-directory: infra/prod
        run: |
          SERVER_IP=$(terraform output -raw public_ip)
          echo "SERVER_IP=$SERVER_IP" >> $GITHUB_ENV

          terraform output -raw private_key_pem > key.pem
          chmod 600 key.pem

          echo "[web]" > inventory.ini
          echo "$SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=$(pwd)/key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'" >> inventory.ini

      - name: Wait EC2
        run: sleep 40

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          SERVER_IP: ${{ env.SERVER_IP }}
        run: |
          python3 -c "
          import os, json
          d = {
            'registry_host': os.environ['REGISTRY_HOST'],
            'registry_user': os.environ['REGISTRY_USER'],
            'registry_password': os.environ['REGISTRY_PASSWORD'],
            'server_ip': os.environ['SERVER_IP'],
            'mysql_root_password': os.environ['MYSQL_ROOT_PASSWORD'],
            'mysql_db': os.environ['MYSQL_DB'],
            'mysql_user': os.environ['MYSQL_USER'],
            'mysql_password': os.environ['MYSQL_PASSWORD'],
          }
          open('/tmp/avars.json','w').write(json.dumps(d))
          "

          ansible-playbook -i infra/prod/inventory.ini ansible/playbook.yml --extra-vars "@/tmp/avars.json"

      - name: Wait MySQL then restart API
        run: |
          ssh -i infra/prod/key.pem -o StrictHostKeyChecking=no ubuntu@${{ env.SERVER_IP }} \
            "echo 'Attente MySQL...' && sleep 20 && docker restart app-api-1"

      - name: Validation post-déploiement
        run: |
          echo "Attente du démarrage..."
          sleep 60

          echo "Test Frontend..."
          curl -f --retry 10 --retry-delay 10 http://${{ env.SERVER_IP }} || exit 1

          echo "Test API..."
          curl -f --retry 10 --retry-delay 10 http://${{ env.SERVER_IP }}:8000/users || exit 1

          echo "Déploiement réussi !"
          echo "Frontend : http://${{ env.SERVER_IP }}"
          echo "API      : http://${{ env.SERVER_IP }}:8000"
          echo "Registry : https://${{ secrets.REGISTRY_HOST }}"