name: Build and Test React Application

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  install:
    name: Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests with coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: coverage
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    name: Tests E2E (Cypress)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx vite build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Start server and run Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npx vite preview --port 5173
          wait-on: "http://localhost:5173"
          wait-on-timeout: 30
          browser: chrome

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - name: Validation
        run: echo "Build and test steps completed successfully."

  publish-npm:
    name: Publish NPM Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check local vs published version
        id: version_check
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageName = pkg.name;
          const localVersion = pkg.version;

          function compareSemver(a, b) {
            const pa = a.split('.').map((v) => parseInt(v, 10));
            const pb = b.split('.').map((v) => parseInt(v, 10));
            for (let i = 0; i < 3; i += 1) {
              const av = Number.isNaN(pa[i]) ? 0 : pa[i];
              const bv = Number.isNaN(pb[i]) ? 0 : pb[i];
              if (av > bv) return 1;
              if (av < bv) return -1;
            }
            return 0;
          }

          let publishedVersion = null;
          try {
            publishedVersion = execSync(`npm view "${packageName}" version`, {
              encoding: 'utf8',
              stdio: ['pipe', 'pipe', 'pipe']
            }).trim();
          } catch (error) {
            publishedVersion = null;
          }

          let shouldPublish = false;
          let reason = '';

          if (!publishedVersion) {
            shouldPublish = true;
            reason = `Package ${packageName} not found on NPM, first publish required.`;
          } else {
            const cmp = compareSemver(localVersion, publishedVersion);
            shouldPublish = cmp === 1;
            reason = shouldPublish
              ? `Local version ${localVersion} is greater than published version ${publishedVersion}.`
              : `Skip publish: local version ${localVersion} is not greater than published version ${publishedVersion}.`;
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${shouldPublish}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `local_version=${localVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published_version=${publishedVersion || 'none'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `reason=${reason}\n`);

          console.log(reason);
          EOF

      - name: Log publish decision
        run: |
          echo "should_publish=${{ steps.version_check.outputs.should_publish }}"
          echo "local_version=${{ steps.version_check.outputs.local_version }}"
          echo "published_version=${{ steps.version_check.outputs.published_version }}"
          echo "reason=${{ steps.version_check.outputs.reason }}"

      - name: Build npm package
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm run build-npm-ci

      - name: Publish package on NPM
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish
        if: steps.version_check.outputs.should_publish != 'true'
        run: echo "NPM publish skipped."

  validate-and-publish-api:
    name: Validate Containerized API and Push Image
    runs-on: ubuntu-latest
    needs: publish-npm
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Start stack with docker compose
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: docker compose up --detach --build --wait

      - name: Check all containers are running
        run: |
          docker compose ps
          docker compose ps | grep -E "db.*healthy" || (echo "db is not healthy" && exit 1)
          docker compose ps | grep -E "api.*running|api.*Up" || (echo "api is not running" && exit 1)
          docker compose ps | grep -E "adminer.*running|adminer.*Up" || (echo "adminer is not running" && exit 1)
          docker compose ps | grep -E "frontend.*running|frontend.*Up" || (echo "frontend is not running" && exit 1)

      - name: Validate /users endpoint with curl
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" http://localhost:8001/users)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Expected HTTP 200, got $HTTP_CODE"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E on real stack
        run: npx cypress run --spec cypress/e2e/fullstack.real.cy.js
        env:
          CYPRESS_baseUrl: http://localhost:5173/TU_TP1

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push API image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag tp1-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/tp1-fastapi:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tp1-fastapi:latest

  deploy:
    name: Deploy App & Documentation
    runs-on: ubuntu-latest
    needs: validate-and-publish-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx vite build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Generate JSDoc documentation
        run: npm run jsdoc

      - name: Copy documentation into dist
        run: cp -r docs dist/docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
